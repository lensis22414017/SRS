<?xml version="1.0" encoding="UTF-8"?>
<!--
  SRS 软件图标 v2 — 参考图重绘
  设计: 1:1 正方形, 白色背景, 四周圆角(微信风格 rx=110), 深蓝盾牌 + 绿色伞状/蘑菇元素
  512x512 矢量, 可转 ICO 多尺寸
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- 深蓝盾牌渐变 (与系统主色 #0f3d6e 一致) -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e5a9e"/>
      <stop offset="60%" stop-color="#0f3d6e"/>
      <stop offset="100%" stop-color="#0a2d52"/>
    </linearGradient>
    <!-- 绿色生态渐变 (菌盖/树冠) -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="70%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <!-- 浅绿叶高光 -->
    <linearGradient id="greenHi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <!-- 柔和阴影 -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- 盾牌路径裁剪 -->
    <clipPath id="shieldClip">
      <path d="M 256 72 L 388 112 Q 396 115 396 124 L 396 280 Q 396 370 256 442 Q 116 370 116 280 L 116 124 Q 116 115 124 112 Z"/>
    </clipPath>
  </defs>

  <!-- 白色圆角方形背景 (微信风格, rx=110 约 21% 圆角) -->
  <rect x="0" y="0" width="512" height="512" rx="110" ry="110" fill="#ffffff"/>

  <!-- 深蓝盾牌主体 -->
  <path d="M 256 72 L 388 112 Q 396 115 396 124 L 396 280 Q 396 370 256 442 Q 116 370 116 280 L 116 124 Q 116 115 124 112 Z"
        fill="url(#shieldGrad)" filter="url(#softShadow)"/>

  <!-- 盾牌内部浅色高光弧 (科技感) -->
  <path d="M 140 130 Q 256 100 372 130" fill="none" stroke="#3b82f6" stroke-width="3" opacity="0.3" stroke-linecap="round"/>
  <path d="M 140 145 Q 256 118 372 145" fill="none" stroke="#60a5fa" stroke-width="1.5" opacity="0.2" stroke-linecap="round"/>

  <!-- 中心元素: 绿色伞状/蘑菇 (盾牌中心) -->
  <g transform="translate(256, 250)">
    <!-- 伞盖/菌盖 (半圆弧, 上方) -->
    <path d="M -78 10 Q -78 -80 0 -80 Q 78 -80 78 10 Z"
          fill="url(#greenGrad)" filter="url(#softShadow)"/>
    <!-- 伞盖高光 (左上, 椭圆) -->
    <ellipse cx="-28" cy="-40" rx="32" ry="18" fill="url(#greenHi)" opacity="0.7"/>
    <!-- 伞盖底部分隔线 (菌褶感) -->
    <path d="M -78 10 Q -40 16 0 16 Q 40 16 78 10"
          fill="none" stroke="#15803d" stroke-width="2.5" opacity="0.5"/>
    <!-- 伞柄/树干 (下方矩形, 连接到底) -->
    <rect x="-14" y="10" width="28" height="100" rx="6" fill="url(#greenGrad)"/>
    <!-- 伞柄高光 -->
    <rect x="-10" y="14" width="6" height="90" rx="3" fill="url(#greenHi)" opacity="0.5"/>
    <!-- 底部土壤基座 (深色弧, 表示土壤) -->
    <ellipse cx="0" cy="115" rx="55" ry="12" fill="#0a2d52" opacity="0.6"/>
  </g>

  <!-- 盾牌底部装饰: 3条采样数据线 (浅蓝, 科技感) -->
  <g stroke="#60a5fa" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round">
    <path d="M 150 390 L 200 380 L 256 388 L 312 375 L 362 385"/>
    <circle cx="150" cy="390" r="3" fill="#60a5fa"/>
    <circle cx="256" cy="388" r="3" fill="#60a5fa"/>
    <circle cx="362" cy="385" r="3" fill="#60a5fa"/>
  </g>
</svg>
