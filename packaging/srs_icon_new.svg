<?xml version="1.0" encoding="UTF-8"?>
<!--
  SRS 软件图标 — 扁平生态科技风
  设计: 圆角方形深蓝科技底 + 抽象土壤层理(暖土色) + 一片生态绿叶 + 采样节点网络(浅蓝)
  主色 #2c5282(蓝灰科技, 与系统 main.tsx colorPrimary 一致) + 绿色生态点缀
  无文字, 几何扁平, 512x512 矢量可缩放
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- 深蓝科技渐变底 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <!-- 土壤层理渐变 -->
    <linearGradient id="soilGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c2956b"/>
      <stop offset="100%" stop-color="#8b6240"/>
    </linearGradient>
    <linearGradient id="soilGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b6240"/>
      <stop offset="100%" stop-color="#5c3f28"/>
    </linearGradient>
    <!-- 绿叶渐变 -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <!-- 简洁阴影 -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 圆角方形科技底 -->
  <rect x="56" y="56" width="400" height="400" rx="88" ry="88" fill="url(#bgGrad)" filter="url(#softShadow)"/>

  <!-- 抽象土壤层理(下半部, 暖土色横条堆叠) -->
  <!-- 土层用波浪横条表达土壤剖面 -->
  <g clip-path="url(#soilClip)">
    <path d="M 56 300 Q 156 280, 256 300 T 456 300 L 456 456 L 56 456 Z" fill="url(#soilGrad)"/>
    <path d="M 56 360 Q 156 345, 256 360 T 456 360 L 456 456 L 56 456 Z" fill="url(#soilGrad2)"/>
    <!-- 土层分界细线(科技感) -->
    <path d="M 56 300 Q 156 280, 256 300 T 456 300" fill="none" stroke="#5c3f28" stroke-width="2" opacity="0.4"/>
    <path d="M 56 360 Q 156 345, 256 360 T 456 360" fill="none" stroke="#3d2818" stroke-width="2" opacity="0.4"/>
  </g>

  <!-- 采样节点网络(科技数据感, 浅蓝圆点 + 连线, 覆盖于土壤上) -->
  <g stroke="#93c5fd" stroke-width="2.5" fill="#bfdbfe" opacity="0.92">
    <!-- 连线(节点间) -->
    <line x1="140" y1="210" x2="220" y2="180" stroke-linecap="round"/>
    <line x1="220" y1="180" x2="300" y2="200" stroke-linecap="round"/>
    <line x1="300" y1="200" x2="372" y2="175" stroke-linecap="round"/>
    <line x1="140" y1="210" x2="180" y2="330" stroke-linecap="round"/>
    <line x1="300" y1="200" x2="250" y2="335" stroke-linecap="round"/>
    <line x1="372" y1="175" x2="350" y2="320" stroke-linecap="round"/>
    <line x1="180" y1="330" x2="250" y2="335" stroke-linecap="round"/>
    <line x1="250" y1="335" x2="350" y2="320" stroke-linecap="round"/>
    <!-- 节点(采样点, 大小代表权重) -->
    <circle cx="140" cy="210" r="9"/>
    <circle cx="220" cy="180" r="7"/>
    <circle cx="300" cy="200" r="11"/>
    <circle cx="372" cy="175" r="8"/>
    <circle cx="180" cy="330" r="8"/>
    <circle cx="250" cy="335" r="10"/>
    <circle cx="350" cy="320" r="7"/>
    <!-- 高亮中心节点(主采样点) -->
    <circle cx="300" cy="200" r="5" fill="#ffffff"/>
  </g>

  <!-- 一片生态绿叶(从土壤中生长, 右上方向) -->
  <g transform="translate(265, 95)">
    <!-- 叶柄 -->
    <path d="M 0 0 Q 8 30, 18 60" fill="none" stroke="#16a34a" stroke-width="4" stroke-linecap="round"/>
    <!-- 叶片主体(椭圆变形, 尖头叶) -->
    <path d="M 18 60 Q 70 35, 88 -15 Q 95 -55, 65 -70 Q 30 -50, 18 60 Z" fill="url(#leafGrad)" filter="url(#softShadow)"/>
    <!-- 叶脉(主脉) -->
    <path d="M 18 60 Q 50 5, 80 -55" fill="none" stroke="#15803d" stroke-width="2.5" opacity="0.6"/>
    <!-- 叶脉(侧脉, 3条) -->
    <path d="M 35 35 Q 50 25, 62 12" fill="none" stroke="#15803d" stroke-width="1.5" opacity="0.5"/>
    <path d="M 48 12 Q 60 5, 72 -10" fill="none" stroke="#15803d" stroke-width="1.5" opacity="0.5"/>
    <path d="M 58 -12 Q 68 -20, 75 -38" fill="none" stroke="#15803d" stroke-width="1.5" opacity="0.5"/>
  </g>
</svg>
