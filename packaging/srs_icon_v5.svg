  <circle cx="162" cy="251" r="14" fill="#65E0C0" stroke="#123B73" stroke-width="8"/>
  <circle cx="278" cy="159" r="14" fill="#65E0C0" stroke="#123B73" stroke-width="8"/>
  <circle cx="302" cy="304" r="14" fill="#65E0C0" stroke="#123B73" stroke-width="8"/>
