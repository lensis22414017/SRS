  <path d="M82 181C120 101 183 61 272 60" fill="none" stroke="#65E0C0" stroke-width="8" stroke-linecap="round" opacity="0.16"/>
  <path d="M430 327C398 409 337 450 245 452" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.12"/>
