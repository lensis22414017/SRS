# factor_aliases_v0.8.yaml — 因子名称规范化别名表（v0.8.1 扩展版）
#
# 设计原则：
# 1. canonical code 与 SHAP measured_contribution group 名严格对齐（BaP_ngg / SumDDTs_ngg 等）
# 2. aliases 覆盖所有可能的列名变体（含中文括号 / 无斜杠单位 / 双语混合）
# 3. 化学形态不同的因子必须独立 canonical（如 TN_gkg vs Hydrolyzable_N_mgkg）
# 4. preferred_unit 指明该 canonical 的目标单位（mg/kg / ng/g / μg/kg），用于智能转换
# 5. EC（电导率）与 CEC（阳离子交换量）严格分离（化学量纲不同）
#
# 修订记录：
# - v0.8.1 (2026-07-21): 新增 12 个有机物 canonical + 9 个 PAH 单体 + 拆分 3 条化学形态冲突

