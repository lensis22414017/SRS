name: CI

on:
  push:
    branches: [main, "fix/**", "feat/**", "codex/**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Python, SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Compile check
        run: |
          python -m compileall backend/app backend/tests -q
      - name: Alembic clean install and latest migration round-trip
        env:
          DATABASE_URL: "sqlite:///./ci_alembic.db"
        run: |
          cd backend
          alembic upgrade head
          alembic downgrade 0005_round9
          alembic upgrade head
          alembic current
      - name: Run pytest
        env:
          DATABASE_URL: "sqlite:///./ci_test.db"
          SECRET_KEY: "ci_only_key_2026_at_least_32_characters_long"
          SRS_DEMO_SEED: "1"
        run: |
          cd backend && python -m pytest tests/ -v --tb=short

  backend-postgres:
    # Round9 P0-4.3: PostgreSQL CI 矩阵 — 验证 setup.py 的 SELECT FOR UPDATE 并发保护
    name: Backend (Python, PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: srs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install psycopg2-binary
      - name: Compile check
        run: |
          python -m compileall backend/app backend/tests -q
      - name: Run pytest (setup concurrency + Round9 audit)
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/srs_test"
          SECRET_KEY: "ci_only_key_2026_at_least_32_characters_long"
          SRS_DEMO_SEED: "1"
        run: |
          cd backend && python -m pytest tests/test_round9_audit.py -v --tb=short -k "setup or stale or kos"

  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          cd frontend && npm ci
      - name: Type check
        run: |
          cd frontend && npx tsc --noEmit
      - name: Build
        run: |
          cd frontend && npm run build
