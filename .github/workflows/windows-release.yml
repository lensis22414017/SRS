name: Windows Release Candidate (build + install + acceptance)

# v1.2 年度验收: 在 Windows 上从源码构建安装包与便携版, 并对"实际安装的程序"执行验收:
#   空库首启 → 首启截图 → 5 个合成场景 + 8 个夹具(与独立期望值比对) → 全功能截图 → 重启一致性 →
#   卸载 → v1.1.0 → 当前版本 覆盖升级 → v1.2.1 → 当前版本 覆盖升级(v1.2.2 起; 此前为 v1.2.0) → 便携版。
# 标准(非管理员)账户安装与运行在独立 job(standard-user)中执行, 失败即该 job 失败, 不再 continue-on-error 掩盖;
# 安装后报告 DOCX 在独立 job(docx-render)中用 LibreOffice 转 PDF 供逐页目检。
# 只使用合成的蒙特卡洛演示数据(demo/mc_v12, demo/mc_v11), 不使用甲方真实数据。

on:
  workflow_dispatch:
  push:
    branches: ["fix/v1.1-client-acceptance", "release/v1.2-annual", "fix/v1.2.1-remediation", "fix/v1.2.2-closeout"]
    tags: ["v1.2.*"]

permissions:
  contents: read
  actions: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  SRS_PORT: "18080"
  V11_RUN_ID: "37866554895"
  V12_RUN_ID: "37909467812"
  # v1.2.2: 覆盖升级测试的直接前一版本 = v1.2.1-rc.1 (Windows run 38046495198 的 srs-installer 产物)
  V121_RUN_ID: "38046495198"

jobs:
  windows-rc:
    runs-on: windows-latest
    timeout-minutes: 170
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout (with LFS models)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify LFS model binaries are real files
        run: |
          $f = Get-ChildItem ml/artifacts/p3_alpha -Filter *.joblib | Select-Object -First 1
          if ($f.Length -lt 100000) { throw "LFS pointer instead of model binary: $($f.Name) $($f.Length) bytes" }
          "model sample: $($f.Name) $($f.Length) bytes"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pyinstaller requests openpyxl pypdf playwright
          python -m playwright install chromium
          pip freeze | Out-File -Encoding utf8 pip_freeze_windows.txt

      - name: Backend gate tests (Windows)
        working-directory: backend
        env:
          SRS_DEMO_SEED: "1"
          SECRET_KEY: "ci_only_key_2026_at_least_32_characters_long"
        run: python -m pytest -q tests/test_v12_recon_thresholds.py tests/test_v11_utilization_ssui.py tests/test_v11_stage_model.py tests/test_v11_persistence_recovery.py tests/test_v11_version_consistency.py tests/test_round10_release_gate.py tests/test_v121_kos_semantics.py tests/test_v121_report_consistency.py

      - name: PyInstaller build
        run: python -m PyInstaller packaging/srs.spec --clean --noconfirm --distpath dist_new

      - name: Inspect bundle (no databases / env files / client raw data / demo outputs)
        run: |
          $bad = Get-ChildItem dist_new/SRS -Recurse -Include *.db,*.sqlite,.env,*.env | Select-Object -ExpandProperty FullName
          $raw = Get-ChildItem dist_new/SRS -Recurse | Where-Object { $_.Name -match '20250731|Special for Python|Data weight calculation|data_dictionary' } | Select-Object -ExpandProperty FullName
          if ($bad -or $raw) { $bad; $raw; throw "bundle contains forbidden files" }
          $std = Get-ChildItem dist_new/SRS -Recurse -Filter "gb36600_2018_official.csv"
          if (-not $std) { throw "official GB 36600 table missing from bundle" }
          "bundle size MB: " + [math]::Round(((Get-ChildItem dist_new/SRS -Recurse | Measure-Object Length -Sum).Sum / 1MB), 1)

      - name: Portable ZIP
        run: |
          $v = (Get-Content VERSION).Trim()
          New-Item -ItemType Directory -Force packaging/Output | Out-Null
          Set-Content -Encoding utf8 dist_new/SRS/SRS_PORTABLE.txt "SRS 便携版: 数据保存在本目录 SRS_data 子目录; 删除本文件即恢复为安装版数据目录(%APPDATA%\SRS)。"
          Compress-Archive -Path dist_new/SRS -DestinationPath "packaging/Output/SRS-Portable-$v-Windows-x64.zip" -Force
          Remove-Item dist_new/SRS/SRS_PORTABLE.txt
          $z = Get-Item "packaging/Output/SRS-Portable-$v-Windows-x64.zip"
          $h = (Get-FileHash $z.FullName -Algorithm SHA256).Hash.ToLower()
          "$h  $($z.Name)" | Out-File -Encoding ascii "$($z.FullName).sha256"
          "PORTABLE=$($z.FullName)" | Out-File -Append $env:GITHUB_ENV
          "portable: $($z.Name) $([math]::Round($z.Length/1MB,1)) MB sha256=$h"

      - name: Inno Setup compile
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          $lang = Join-Path (Split-Path $iscc) "Languages"
          Copy-Item packaging/ChineseSimplified.isl (Join-Path $lang "ChineseSimplified.isl") -Force
          & $iscc packaging\srs_setup.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          $exe = Get-ChildItem packaging\Output -Filter "SRS-Setup-*-Windows-x64.exe" | Sort-Object LastWriteTime | Select-Object -Last 1
          $h = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$h  $($exe.Name)" | Out-File -Encoding ascii "$($exe.FullName).sha256"
          "INSTALLER=$($exe.FullName)" | Out-File -Append $env:GITHUB_ENV
          "installer: $($exe.Name) $([math]::Round($exe.Length/1MB,1)) MB sha256=$h"

      - name: Upload installer + portable (before acceptance, for diagnosis)
        uses: actions/upload-artifact@v4
        with:
          name: srs-installer
          path: |
            packaging/Output/SRS-Setup-*-Windows-x64.exe
            packaging/Output/SRS-Setup-*-Windows-x64.exe.sha256
            packaging/Output/SRS-Portable-*-Windows-x64.zip
            packaging/Output/SRS-Portable-*-Windows-x64.zip.sha256
          retention-days: 30

      - name: Silent install (current user, Chinese + space path)
        run: |
          $dir = "C:\SRS 验收\安装 目录"
          "INSTALL_DIR=$dir" | Out-File -Append $env:GITHUB_ENV
          New-Item -ItemType Directory -Force acceptance_out | Out-Null
          # 构建步骤(导入 backend 生成资源)会在 runner 上创建 %APPDATA%\SRS; 记录后清除, 模拟干净机器
          if (Test-Path "$env:APPDATA\SRS") { Get-ChildItem "$env:APPDATA\SRS" -Recurse | Select-Object FullName, Length | ConvertTo-Json | Out-File -Encoding utf8 acceptance_out/appdata_before_install_build_residue.json; Remove-Item -Recurse -Force "$env:APPDATA\SRS" }
          if (Test-Path "$env:APPDATA\SRS") { throw "APPDATA\SRS still exists before install" }
          $p = Start-Process $env:INSTALLER -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER',"/DIR=`"$dir`"",'/LOG=install.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exit $($p.ExitCode)" }
          if (-not (Test-Path "$dir\SRS.exe")) { throw "SRS.exe missing after install" }
          $std = Get-ChildItem $dir -Recurse -Filter "gb36600_2018_official.csv" | Select-Object -First 1
          if (-not $std) { throw "standards not installed" }
          New-Item -ItemType Directory -Force acceptance_out | Out-Null
          Get-ChildItem $dir -Recurse -Include *.csv,*.json,*.joblib | Where-Object { $_.FullName -match 'standards|params|p3_alpha' } |
            Select-Object @{n='file';e={$_.FullName.Replace($dir,'')}}, Length |
            ConvertTo-Json | Out-File -Encoding utf8 acceptance_out/installed_resources.json

      - name: First launch screenshots (before admin setup)
        run: |
          $app = Start-Process "$env:INSTALL_DIR\SRS.exe" -ArgumentList '--port',$env:SRS_PORT,'--no-browser','--no-tray' -PassThru
          for ($i=0; $i -lt 90; $i++) { try { if ((Invoke-WebRequest "http://127.0.0.1:$env:SRS_PORT/health" -UseBasicParsing -TimeoutSec 3).StatusCode -eq 200) { break } } catch {}; Start-Sleep 2 }
          python packaging/ci/ui_screenshots.py --base "http://127.0.0.1:$env:SRS_PORT" --out acceptance_out/screenshots --stage first_run
          "APP_PID=$($app.Id)" | Out-File -Append $env:GITHUB_ENV

      - name: Key workflow acceptance (5 scenarios + fixtures) + full screenshots
        run: |
          python packaging/ci/windows_acceptance.py --base "http://127.0.0.1:$env:SRS_PORT" --demo demo/mc_v12 --out acceptance_out --phase full
          $code = $LASTEXITCODE
          python packaging/ci/ui_screenshots.py --base "http://127.0.0.1:$env:SRS_PORT" --out acceptance_out/screenshots --stage main --demo demo/mc_v12
          $shot = $LASTEXITCODE
          python packaging/ci/windows_acceptance.py --base "http://127.0.0.1:$env:SRS_PORT" --demo demo/mc_v12 --out acceptance_out --phase snapshot
          $snap = $LASTEXITCODE
          Stop-Process -Id $env:APP_PID -Force -ErrorAction SilentlyContinue; Start-Sleep 5
          Get-Process SRS -ErrorAction SilentlyContinue | Stop-Process -Force
          if ($code -ne 0) { throw "acceptance full phase failed" }
          if ($shot -ne 0) { throw "screenshot capture failed" }
          if ($snap -ne 0) { throw "pre-restart snapshot failed" }

      - name: Restart consistency (repeated launch)
        run: |
          $app = Start-Process "$env:INSTALL_DIR\SRS.exe" -ArgumentList '--port',$env:SRS_PORT,'--no-browser','--no-tray' -PassThru
          python packaging/ci/windows_acceptance.py --base "http://127.0.0.1:$env:SRS_PORT" --demo demo/mc_v12 --out acceptance_out --phase restart
          $code = $LASTEXITCODE
          Stop-Process -Id $app.Id -Force; Start-Sleep 3
          Get-Process SRS -ErrorAction SilentlyContinue | Stop-Process -Force
          Copy-Item "$env:APPDATA\SRS\launcher.log" acceptance_out\launcher_main.log -ErrorAction SilentlyContinue
          if ($code -ne 0) { throw "acceptance restart phase failed" }

      - name: Uninstall (user data retained in APPDATA)
        run: |
          $u = Get-ChildItem $env:INSTALL_DIR -Filter "unins*.exe" | Select-Object -First 1
          Start-Process $u.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          Start-Sleep 5
          if (Test-Path "$env:INSTALL_DIR\SRS.exe") { throw "SRS.exe still present after uninstall" }
          $kept = Test-Path "$env:APPDATA\SRS\srs.db"
          "appdata db retained after uninstall: $kept" | Tee-Object -FilePath acceptance_out/uninstall.txt
          if (-not $kept) { throw "user database removed by uninstall" }
          Rename-Item "$env:APPDATA\SRS" "SRS_after_main_acceptance"

      - name: Download v1.1.0 installer (previous release candidate build)
        uses: actions/download-artifact@v4
        with:
          name: srs-installer
          path: v11_installer
          run-id: ${{ env.V11_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Upgrade v1.1.0 → current (in place, data retained)
        run: |
          $old = Get-ChildItem v11_installer -Filter "SRS-Setup-1.1.0-Windows-x64.exe" | Select-Object -First 1
          if (-not $old) { throw "v1.1.0 installer artifact not found" }
          $dir = "C:\SRS 升级\安装 目录"
          $p = Start-Process $old.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER',"/DIR=`"$dir`"",'/LOG=install_v11.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "v1.1 installer exit $($p.ExitCode)" }
          $app = Start-Process "$dir\SRS.exe" -ArgumentList '--port',$env:SRS_PORT,'--no-browser','--no-tray' -PassThru
          python packaging/ci/windows_acceptance.py --base "http://127.0.0.1:$env:SRS_PORT" --demo demo/mc_v11 --out acceptance_out --phase seed_v11
          $c1 = $LASTEXITCODE
          Stop-Process -Id $app.Id -Force; Start-Sleep 3; Get-Process SRS -ErrorAction SilentlyContinue | Stop-Process -Force
          if ($c1 -ne 0) { throw "v1.1 seed phase failed" }
          (Get-Item "$env:APPDATA\SRS\srs.db").Length | Out-File acceptance_out\pre_upgrade_db_size.txt
          $p = Start-Process $env:INSTALLER -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER',"/DIR=`"$dir`"",'/LOG=install_upgrade.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "upgrade installer exit $($p.ExitCode)" }
          $app = Start-Process "$dir\SRS.exe" -ArgumentList '--port',$env:SRS_PORT,'--no-browser','--no-tray' -PassThru
          python packaging/ci/windows_acceptance.py --base "http://127.0.0.1:$env:SRS_PORT" --demo demo/mc_v12 --out acceptance_out --phase upgrade
          $c2 = $LASTEXITCODE
          Stop-Process -Id $app.Id -Force; Start-Sleep 3; Get-Process SRS -ErrorAction SilentlyContinue | Stop-Process -Force
          Copy-Item "$env:APPDATA\SRS\launcher.log" acceptance_out\launcher_upgrade.log -ErrorAction SilentlyContinue
          $u = Get-ChildItem $dir -Filter "unins*.exe" | Select-Object -First 1
          Start-Process $u.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          if ($c2 -ne 0) { throw "upgrade phase failed" }
          Rename-Item "$env:APPDATA\SRS" "SRS_after_upgrade"

      - name: Download v1.2.1 installer (rc.1 build, run ${{ env.V121_RUN_ID }})
        uses: actions/download-artifact@v4
        with:
          name: srs-installer
          path: v12_installer
          run-id: ${{ env.V121_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Upgrade v1.2.1 → current (in place, data + reports retained, legacy out-of-domain SSUI no longer graded)
        env:
          OLD_VERSION: "1.2.1"
        run: |
          $old = Get-ChildItem v12_installer -Filter "SRS-Setup-1.2.1-Windows-x64.exe" | Select-Object -First 1
          if (-not $old) { throw "v1.2.1 installer artifact not found" }
          (Get-FileHash $old.FullName -Algorithm SHA256).Hash.ToLower() | Out-File acceptance_out\v121_installer_sha256.txt
          $dir = "C:\SRS 升级121\安装 目录"
          $p = Start-Process $old.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER',"/DIR=`"$dir`"",'/LOG=install_v121.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "v1.2.1 installer exit $($p.ExitCode)" }
          $app = Start-Process "$dir\SRS.exe" -ArgumentList '--port',$env:SRS_PORT,'--no-browser','--no-tray' -PassThru
          for ($i=0; $i -lt 90; $i++) { try { if ((Invoke-WebRequest "http://127.0.0.1:$env:SRS_PORT/health" -UseBasicParsing -TimeoutSec 3).StatusCode -eq 200) { break } } catch {}; Start-Sleep 2 }
          python packaging/ci/windows_acceptance.py --base "http://127.0.0.1:$env:SRS_PORT" --demo demo/mc_v12 --out acceptance_out --phase seed_v12
          $c1 = $LASTEXITCODE
          Stop-Process -Id $app.Id -Force; Start-Sleep 3; Get-Process SRS -ErrorAction SilentlyContinue | Stop-Process -Force
          if ($c1 -ne 0) { throw "v1.2.1 seed phase failed" }
          $p = Start-Process $env:INSTALLER -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER',"/DIR=`"$dir`"",'/LOG=install_upgrade_v121.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "upgrade (from 1.2.1) installer exit $($p.ExitCode)" }
          $app = Start-Process "$dir\SRS.exe" -ArgumentList '--port',$env:SRS_PORT,'--no-browser','--no-tray' -PassThru
          for ($i=0; $i -lt 90; $i++) { try { if ((Invoke-WebRequest "http://127.0.0.1:$env:SRS_PORT/health" -UseBasicParsing -TimeoutSec 3).StatusCode -eq 200) { break } } catch {}; Start-Sleep 2 }
          python packaging/ci/windows_acceptance.py --base "http://127.0.0.1:$env:SRS_PORT" --demo demo/mc_v12 --out acceptance_out --phase upgrade_v12
          $c2 = $LASTEXITCODE
          Stop-Process -Id $app.Id -Force; Start-Sleep 3; Get-Process SRS -ErrorAction SilentlyContinue | Stop-Process -Force
          Copy-Item "$env:APPDATA\SRS\launcher.log" acceptance_out\launcher_upgrade_v121.log -ErrorAction SilentlyContinue
          $u = Get-ChildItem $dir -Filter "unins*.exe" | Select-Object -First 1
          Start-Process $u.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          if ($c2 -ne 0) { throw "upgrade from v1.2.1 phase failed" }
          Rename-Item "$env:APPDATA\SRS" "SRS_after_upgrade_v121"

      - name: Portable package (Chinese + space path, data beside exe)
        run: |
          $dest = "C:\SRS 便携 测试"
          Expand-Archive $env:PORTABLE -DestinationPath $dest -Force
          if (-not (Test-Path "$dest\SRS\SRS_PORTABLE.txt")) { throw "portable marker missing" }
          $app = Start-Process "$dest\SRS\SRS.exe" -ArgumentList '--port',$env:SRS_PORT,'--no-browser','--no-tray' -PassThru
          python packaging/ci/windows_acceptance.py --base "http://127.0.0.1:$env:SRS_PORT" --demo demo/mc_v12 --out acceptance_out --phase portable
          $c = $LASTEXITCODE
          Stop-Process -Id $app.Id -Force; Start-Sleep 3; Get-Process SRS -ErrorAction SilentlyContinue | Stop-Process -Force
          $inside = Test-Path "$dest\SRS\SRS_data\srs.db"
          $appdata = Test-Path "$env:APPDATA\SRS\srs.db"
          "portable db beside exe: $inside; APPDATA db created: $appdata" | Tee-Object -FilePath acceptance_out/portable.txt
          if ($c -ne 0 -or -not $inside -or $appdata) { throw "portable acceptance failed" }

      - name: Environment record
        if: always()
        run: |
          $o = @{ os = (Get-CimInstance Win32_OperatingSystem).Caption; build = [Environment]::OSVersion.VersionString;
                  user = $env:USERNAME; commit = $env:GITHUB_SHA; ref = $env:GITHUB_REF; run = $env:GITHUB_RUN_ID;
                  install_dir = $env:INSTALL_DIR; is_admin = ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator) }
          New-Item -ItemType Directory -Force acceptance_out | Out-Null
          $o | ConvertTo-Json | Out-File -Encoding utf8 acceptance_out/environment.json
          Copy-Item pip_freeze_windows.txt acceptance_out\ -ErrorAction SilentlyContinue
          Get-Content acceptance_out/environment.json

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: srs-windows-acceptance
          path: |
            acceptance_out
            install.log
            install_v11.log
            install_upgrade.log
            install_v121.log
            install_upgrade_v121.log
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────────
  # R06: 标准(非管理员)账户安装 + 运行。独立 job, 失败即失败(无 continue-on-error)。
  #  A) 复现 v1.2.0 的方式(管理员会话 Start-Process -Credential), 只做诊断记录;
  #  B) 计划任务以标准账户身份运行安装与程序(需为测试账户授予“作为批处理作业登录”权限, 属测试环境配置,
  #     与真人在 Windows 10/11 上交互登录不同, 结果不代替实机测试)。
  standard-user:
    needs: windows-rc
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Acceptance client deps
        run: pip install requests openpyxl pypdf
      - uses: actions/download-artifact@v4
        with:
          name: srs-installer
          path: inst
      - name: Create standard account (member of Users only)
        run: |
          $pw = "Srs!" + [guid]::NewGuid().ToString("N").Substring(0,16)
          "SRS_STD_PW=$pw" | Out-File -Append $env:GITHUB_ENV
          $sec = ConvertTo-SecureString $pw -AsPlainText -Force
          New-LocalUser -Name "srsstd" -Password $sec -PasswordNeverExpires | Out-Null
          Add-LocalGroupMember -Group "Users" -Member "srsstd"
          New-Item -ItemType Directory -Force std_out, C:\Users\Public\srs_std | Out-Null
          icacls C:\Users\Public\srs_std /grant "Users:(OI)(CI)M" | Out-Null
          $exe = Get-ChildItem inst -Recurse -Filter "SRS-Setup-*-Windows-x64.exe" | Select-Object -First 1
          Copy-Item $exe.FullName C:\Users\Public\srs_std\setup.exe
          $adm = (Get-LocalGroupMember -Group "Administrators" | Select-Object -ExpandProperty Name) -join ","
          $usr = (Get-LocalGroupMember -Group "Users" | Select-Object -ExpandProperty Name) -join ","
          "Administrators: $adm`nUsers: $usr`ninstaller: $($exe.Name) sha256=$((Get-FileHash $exe.FullName).Hash.ToLower())" | Tee-Object std_out\accounts.txt
      - name: "A) diagnosis: Start-Process -Credential from runner admin session (v1.2.0 method)"
        run: |
          $sec = ConvertTo-SecureString $env:SRS_STD_PW -AsPlainText -Force
          $cred = New-Object System.Management.Automation.PSCredential("$env:COMPUTERNAME\srsstd", $sec)
          $t0 = Get-Date
          try {
            $p = Start-Process "C:\Users\Public\srs_std\setup.exe" -Credential $cred -LoadUserProfile -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER','/LOG=C:\Users\Public\srs_std\install_std_A.log' -Wait -PassThru
            "A exit: $($p.ExitCode)" | Tee-Object std_out\A_result.txt
          } catch { "A exception: $_" | Tee-Object std_out\A_result.txt }
          "A log exists: $(Test-Path C:\Users\Public\srs_std\install_std_A.log)" | Tee-Object -Append std_out\A_result.txt
          Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=$t0} -ErrorAction SilentlyContinue | Select-Object -First 30 TimeCreated, ProviderName, Id, LevelDisplayName, Message | Format-List | Out-File std_out\A_application_events.txt
          Get-ChildItem C:\Users\srsstd\AppData\Local\Programs -Recurse -Filter SRS.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName | Out-File -Append std_out\A_result.txt
          Copy-Item C:\Users\Public\srs_std\install_std_A.log std_out\ -ErrorAction SilentlyContinue
          # 清理 A 可能产生的半安装, 保证 B 从干净状态开始
          $u = Get-ChildItem C:\Users\srsstd\AppData\Local\Programs -Recurse -Filter "unins*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($u) { "A produced an install at $($u.DirectoryName); B reuses the account but installs again" | Tee-Object -Append std_out\A_result.txt }
      - name: "B) standard account via scheduled task: install + run + acceptance"
        run: |
          $o = "C:\Users\Public\srs_std"
          @'
          $o = "C:\Users\Public\srs_std"
          whoami /all | Out-File "$o\B_whoami.txt"
          "TEMP=$env:TEMP`nLOCALAPPDATA=$env:LOCALAPPDATA`nAPPDATA=$env:APPDATA`nUSERPROFILE=$env:USERPROFILE" | Out-File "$o\B_env.txt"
          try { Set-Content "$env:TEMP\srs_probe.txt" "x"; "TEMP writable" | Out-File -Append "$o\B_env.txt" } catch { "TEMP not writable: $_" | Out-File -Append "$o\B_env.txt" }
          $admin = ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          "is_admin=$admin" | Out-File -Append "$o\B_env.txt"
          $p = Start-Process "$o\setup.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER',"/LOG=$o\install_std_B.log" -Wait -PassThru
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter SRS.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          "exit=$($p.ExitCode)`nexe=$($exe.FullName)" | Out-File "$o\B_install_exit.txt"
          if ($exe) { $a = Start-Process $exe.FullName -ArgumentList '--port','18090','--no-browser','--no-tray' -PassThru; "pid=$($a.Id)" | Out-File -Append "$o\B_install_exit.txt"; Start-Sleep 1500 }
          '@ | Set-Content -Encoding utf8 "$o\task.ps1"
          # 测试账户授予 SeBatchLogonRight(计划任务以密码登录所需), 记录前后策略
          secedit /export /cfg std_out\secpol_before.inf | Out-Null
          $sid = (New-Object System.Security.Principal.NTAccount("srsstd")).Translate([System.Security.Principal.SecurityIdentifier]).Value
          $cfg = Get-Content std_out\secpol_before.inf
          $line = $cfg | Where-Object { $_ -match '^SeBatchLogonRight' }
          if ($line) { $cfg = $cfg -replace '^SeBatchLogonRight = (.*)$', "SeBatchLogonRight = `$1,*$sid" } else { $cfg = $cfg -replace '^\[Privilege Rights\]$', "[Privilege Rights]`r`nSeBatchLogonRight = *$sid" }
          $cfg | Set-Content -Encoding Unicode secpol_new.inf
          secedit /configure /db secedit.sdb /cfg secpol_new.inf /areas USER_RIGHTS | Out-File std_out\secedit_configure.txt
          $act = New-ScheduledTaskAction -Execute "powershell.exe" -Argument "-NoProfile -ExecutionPolicy Bypass -File $o\task.ps1"
          Register-ScheduledTask -TaskName "srs_std" -Action $act -User "$env:COMPUTERNAME\srsstd" -Password $env:SRS_STD_PW -RunLevel Limited | Out-Null
          Start-ScheduledTask -TaskName "srs_std"
          for ($i=0; $i -lt 120 -and -not (Test-Path "$o\B_install_exit.txt"); $i++) { Start-Sleep 5 }
          Get-ScheduledTaskInfo -TaskName "srs_std" | Format-List | Out-File std_out\B_task_info.txt
          Copy-Item "$o\B_*.txt","$o\install_std_B.log" std_out\ -ErrorAction SilentlyContinue
          if (-not (Test-Path "$o\B_install_exit.txt")) { throw "B: task did not report installer result (see B_task_info.txt)" }
          $res = Get-Content "$o\B_install_exit.txt" -Raw; $res
          if ($res -notmatch 'exit=0') { throw "B: standard-user installer failed: $res" }
          if ($res -notmatch 'exe=C:\\Users\\srsstd') { throw "B: SRS.exe not installed under the standard user's profile: $res" }
          $up = $false
          for ($i=0; $i -lt 90; $i++) { try { if ((Invoke-WebRequest "http://127.0.0.1:18090/health" -UseBasicParsing -TimeoutSec 3).StatusCode -eq 200) { $up = $true; break } } catch {}; Start-Sleep 2 }
          $owner = (Get-Process SRS -IncludeUserName -ErrorAction SilentlyContinue | Select-Object -ExpandProperty UserName) -join ","
          "process owner(s): $owner; reachable: $up" | Tee-Object std_out\B_runtime.txt
          python packaging/ci/windows_acceptance.py --base "http://127.0.0.1:18090" --demo demo/mc_v12 --out std_out --phase portable
          $c = $LASTEXITCODE
          $appdata = Test-Path "C:\Users\srsstd\AppData\Roaming\SRS\srs.db"
          "acceptance exit: $c; db under standard user's APPDATA: $appdata" | Tee-Object -Append std_out\B_runtime.txt
          Stop-ScheduledTask -TaskName "srs_std" -ErrorAction SilentlyContinue
          Get-Process SRS -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $up) { throw "B: SRS.exe started by the standard user did not become reachable" }
          if ($owner -notmatch 'srsstd') { throw "B: SRS process not owned by srsstd ($owner)" }
          if ($c -ne 0) { throw "B: acceptance against standard-user instance failed" }
          if (-not $appdata) { throw "B: user database not created in the standard user's APPDATA" }
      - name: Upload standard-user evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: srs-standard-user
          path: std_out
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────────
  # R04: 安装版生成的 DOCX 报告用 LibreOffice 转 PDF, 供逐页目检(DOCX 可在 Word 外正确打开与排版)。
  docx-render:
    needs: windows-rc
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: srs-windows-acceptance
          path: acc
      - name: Install LibreOffice
        run: choco install libreoffice-fresh -y --no-progress
      - name: Convert DOCX reports to PDF
        run: |
          $so = Get-ChildItem "C:\Program Files\LibreOffice\program" -Filter soffice.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force docx_pdf | Out-Null
          $docs = Get-ChildItem acc -Recurse -Filter "*_report.docx"
          foreach ($d in $docs) { & $so.FullName --headless --norestore --convert-to pdf --outdir docx_pdf $d.FullName | Out-Null }
          Get-ChildItem docx_pdf | Select-Object Name, Length | Format-Table | Out-String | Tee-Object docx_pdf\listing.txt
          if ((Get-ChildItem docx_pdf -Filter *.pdf).Count -lt $docs.Count) { throw "not all DOCX converted" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: srs-docx-rendered
          path: docx_pdf
          retention-days: 30
