<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" font-family="'Helvetica Neue','Arial','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2f7"/></linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/></marker>
    <marker id="arDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/></marker>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.1"/></filter>
  </defs>

  <rect width="920" height="620" fill="url(#bg)" rx="12"/>
  <text x="460" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1e293b">障碍因子诊断方法 — KOS 关键障碍因子综合评分</text>
  <text x="460" y="54" text-anchor="middle" font-size="11" fill="#64748b">规则判障碍 · 权重定用途 · 模型给贡献 · 稳定性定关键 · 证据等级定可信度</text>
  <line x1="60" y1="68" x2="860" y2="68" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- ===== Layer label: Input ===== -->
  <text x="40" y="90" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="1">INPUT</text>
  <rect x="30" y="96" width="860" height="46" rx="6" fill="#dbeafe" opacity="0.2" stroke="#3b82f6" stroke-width="1" stroke-dasharray="0" filter="url(#sh)"/>
  <text x="50" y="116" font-size="11" font-weight="600" fill="#1e40af">场地检测数据</text>
  <text x="50" y="132" font-size="9" fill="#3b5f8a">measurements 长表</text>
  <text x="260" y="116" font-size="11" font-weight="600" fill="#1e40af">GEE 空间协变量</text>
  <text x="260" y="132" font-size="9" fill="#3b5f8a">NDVI·降水·SOC 等 14 项</text>
  <text x="500" y="116" font-size="11" font-weight="600" fill="#1e40af">阈值标准库</text>
  <text x="500" y="132" font-size="9" fill="#3b5f8a">GB15618 / GB36600 + pH路由</text>
  <text x="740" y="116" font-size="11" font-weight="600" fill="#1e40af">修复后用途</text>
  <text x="740" y="132" font-size="9" fill="#3b5f8a">生产 / 生态 → 选轨</text>

  <path d="M460 142 L460 156" stroke="#64748b" stroke-width="2" marker-end="url(#ar)" fill="none"/>

  <!-- ===== Layer label: Dual track ===== -->
  <text x="40" y="172" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="1">DUAL TRACK</text>

  <rect x="30" y="178" width="420" height="58" rx="8" fill="#dbeafe" opacity="0.25" stroke="#3b82f6" stroke-width="1.5" filter="url(#sh)"/>
  <text x="50" y="198" font-size="13" font-weight="700" fill="#1e40af">生产轨 Production</text>
  <text x="50" y="216" font-size="10" fill="#1e3a5f">GB 15618 农用地 · 食用安全 / 作物吸收 / 肥力</text>
  <text x="50" y="230" font-size="10" fill="#1e3a5f">权重锚定课题二 AHP + 熵值组合赋权</text>

  <rect x="470" y="178" width="420" height="58" rx="8" fill="#d1fae5" opacity="0.25" stroke="#10b981" stroke-width="1.5" filter="url(#sh)"/>
  <text x="490" y="198" font-size="13" font-weight="700" fill="#065f46">生态轨 Ecology</text>
  <text x="490" y="216" font-size="10" fill="#064e3b">GB 36600 建设用地 · 生态毒性 / 植被恢复 / 生物活性</text>
  <text x="490" y="230" font-size="10" fill="#064e3b">权重锚定课题二 AHP + 熵值组合赋权</text>

  <path d="M240 236 L240 252" stroke="#64748b" stroke-width="2" marker-end="url(#ar)" fill="none"/>
  <path d="M680 236 L680 252" stroke="#64748b" stroke-width="2" marker-end="url(#ar)" fill="none"/>

  <!-- ===== Layer label: Rule layer ===== -->
  <text x="40" y="268" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="1">RULE LAYER</text>

  <!-- B: solid box -->
  <rect x="30" y="274" width="420" height="56" rx="8" fill="#fef3c7" opacity="0.3" stroke="#f59e0b" stroke-width="1.5" filter="url(#sh)"/>
  <text x="50" y="294" font-size="12" font-weight="700" fill="#92400e">明确障碍判定 B</text>
  <text x="50" y="310" font-size="9" fill="#78350f">上限型 x&gt;U · 下限型 x&lt;L · 区间型 x∉[L,U] · 等级型 g∈G</text>
  <text x="50" y="322" font-size="9" fill="#78350f">B=1 确认障碍 | B=0 不判定 → 标记"建议补测"</text>

  <!-- R: dashed box (auxiliary) -->
  <rect x="470" y="274" width="420" height="56" rx="8" fill="#fee2e2" opacity="0.2" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="6,3" filter="url(#sh)"/>
  <text x="490" y="294" font-size="12" font-weight="700" fill="#991b1b">规则严重度 R</text>
  <text x="490" y="310" font-size="9" fill="#7f1d1d">R = min(1, log(1+x/U) / log(1+c))，对数截尾</text>
  <text x="490" y="322" font-size="9" fill="#7f1d1d">区间型(pH) / 下限型(SOC) 各有专属公式</text>

  <path d="M240 330 L240 350" stroke="#64748b" stroke-width="2" marker-end="url(#ar)" fill="none"/>
  <path d="M680 330 L680 350" stroke="#64748b" stroke-width="2" marker-end="url(#ar)" fill="none"/>
  <path d="M680 350 L500 375" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arDash)" fill="none"/>
  <path d="M240 350 L420 375" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arDash)" fill="none"/>

  <!-- ===== Layer label: KOS Core ===== -->
  <text x="40" y="366" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="1">KOS SCORING</text>

  <rect x="30" y="372" width="860" height="130" rx="10" fill="#ede9fe" opacity="0.15" stroke="#7c3aed" stroke-width="2" filter="url(#sh)"/>
  <text x="460" y="394" text-anchor="middle" font-size="14" font-weight="700" fill="#5b21b6">KOS 关键障碍综合得分（仅在 B=1 时计算）</text>
  <line x1="80" y1="404" x2="840" y2="404" stroke="#c4b5fd"/>

  <rect x="90" y="412" width="740" height="32" rx="6" fill="#fff" stroke="#c4b5fd" stroke-width="1"/>
  <text x="460" y="433" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">KOS = B × ( 0.30 R + 0.25 W + 0.15 M + 0.20 S + 0.10 E )</text>

  <!-- Five components: R solid, W solid, M dashed(aux), S dashed, E dashed -->
  <g font-size="9">
    <rect x="55" y="455" width="140" height="38" rx="4" fill="#fef3c7" opacity="0.3" stroke="#f59e0b"/>
    <text x="125" y="470" text-anchor="middle" font-weight="700" fill="#92400e">R 规则严重度</text>
    <text x="125" y="484" text-anchor="middle" fill="#78350f">超标程度(对数截尾) 0.30</text>

    <rect x="205" y="455" width="140" height="38" rx="4" fill="#dbeafe" opacity="0.3" stroke="#3b82f6"/>
    <text x="275" y="470" text-anchor="middle" font-weight="700" fill="#1e40af">W 用途权重</text>
    <text x="275" y="484" text-anchor="middle" fill="#1e3a5f">AHP+熵值组合赋权 0.25</text>

    <!-- M: dashed = model auxiliary -->
    <rect x="355" y="455" width="140" height="38" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-dasharray="5,3"/>
    <text x="425" y="470" text-anchor="middle" font-weight="700" fill="#334155">M 模型贡献度</text>
    <text x="425" y="484" text-anchor="middle" fill="#475569">SHAP归一化 0.15</text>

    <!-- S: dashed = auxiliary -->
    <rect x="505" y="455" width="140" height="38" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-dasharray="5,3"/>
    <text x="575" y="470" text-anchor="middle" font-weight="700" fill="#334155">S 稳定性</text>
    <text x="575" y="484" text-anchor="middle" fill="#475569">点/空间/Bootstrap 0.20</text>

    <!-- E: dashed = auxiliary -->
    <rect x="655" y="455" width="190" height="38" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-dasharray="5,3"/>
    <text x="750" y="470" text-anchor="middle" font-weight="700" fill="#334155">E 证据强度</text>
    <text x="750" y="484" text-anchor="middle" fill="#475569">A/B/C/D四级 0.10 (仅A/B入TopN)</text>
  </g>

  <!-- Legend: solid vs dashed -->
  <rect x="55" y="500" width="12" height="8" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="72" y="508" font-size="8" fill="#64748b">实线 = 规则主导</text>
  <rect x="180" y="500" width="12" height="8" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="197" y="508" font-size="8" fill="#64748b">虚线 = 模型辅助/参考</text>

  <path d="M460 512 L460 528" stroke="#64748b" stroke-width="2" marker-end="url(#ar)" fill="none"/>

  <!-- ===== Layer label: Output ===== -->
  <text x="40" y="544" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="1">OUTPUT</text>

  <rect x="30" y="550" width="420" height="50" rx="8" fill="#dbeafe" opacity="0.25" stroke="#3b82f6" stroke-width="1.5" filter="url(#sh)"/>
  <text x="50" y="570" font-size="12" font-weight="700" fill="#1e40af">KOS_prod 排序 → 生产用途诊断</text>
  <text x="50" y="588" font-size="9" fill="#1e3a5f">Top-N 排名 · 五分量分解 · 补测建议 · 追溯审计</text>

  <rect x="470" y="550" width="420" height="50" rx="8" fill="#d1fae5" opacity="0.25" stroke="#10b981" stroke-width="1.5" filter="url(#sh)"/>
  <text x="490" y="570" font-size="12" font-weight="700" fill="#065f46">KOS_eco 排序 → 生态用途诊断</text>
  <text x="490" y="588" font-size="9" fill="#064e3b">Top-N 排名 · 五分量分解 · 补测建议 · 追溯审计</text>

  <text x="460" y="614" text-anchor="middle" font-size="9" fill="#94a3b8">依据：Lundberg &amp; Lee (2017) SHAP · GB 15618/36600-2018 · 课题二 AHP/熵值组合赋权 · Rudin (2019) 可解释性</text>
</svg>
