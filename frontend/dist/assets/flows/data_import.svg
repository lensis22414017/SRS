<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <linearGradient id="bgD" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2f7"/></linearGradient>
    <marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/></marker>
    <filter id="shD" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="900" height="350" fill="url(#bgD)" rx="12"/>
  <text x="450" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1e293b">数据导入 — 多源检测数据标准化录入</text>
  <line x1="100" y1="48" x2="800" y2="48" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Input file -->
  <rect x="30" y="70" width="120" height="100" rx="10" fill="#bfdbfe" filter="url(#shD)"/>
  <text x="90" y="100" text-anchor="middle" font-size="28">📄</text>
  <text x="90" y="125" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a5f">原始文件</text>
  <text x="90" y="142" text-anchor="middle" font-size="10" fill="#475569">Excel / CSV</text>
  <text x="90" y="158" text-anchor="middle" font-size="10" fill="#475569">检测数据</text>

  <!-- Arrow -->
  <path d="M150 120 L195 120" stroke="#64748b" stroke-width="2" marker-end="url(#arrD)" fill="none"/>

  <!-- Process steps horizontal -->
  <rect x="200" y="75" width="120" height="50" rx="8" fill="#fef3c7" filter="url(#shD)"/>
  <text x="260" y="98" text-anchor="middle" font-size="12" font-weight="600" fill="#78350f">① 文件解析</text>
  <text x="260" y="115" text-anchor="middle" font-size="9" fill="#92400e">列名检测·编码识别</text>

  <rect x="340" y="75" width="120" height="50" rx="8" fill="#fef3c7" filter="url(#shD)"/>
  <text x="400" y="98" text-anchor="middle" font-size="12" font-weight="600" fill="#78350f">② 字段映射</text>
  <text x="400" y="115" text-anchor="middle" font-size="9" fill="#92400e">列名→系统字段</text>

  <rect x="480" y="75" width="120" height="50" rx="8" fill="#fef3c7" filter="url(#shD)"/>
  <text x="540" y="98" text-anchor="middle" font-size="12" font-weight="600" fill="#78350f">③ 数据校验</text>
  <text x="540" y="115" text-anchor="middle" font-size="9" fill="#92400e">单位·范围·重复</text>

  <rect x="620" y="75" width="120" height="50" rx="8" fill="#fef3c7" filter="url(#shD)"/>
  <text x="680" y="98" text-anchor="middle" font-size="12" font-weight="600" fill="#78350f">④ 去重策略</text>
  <text x="680" y="115" text-anchor="middle" font-size="9" fill="#92400e">跳过/覆盖/版本</text>

  <rect x="760" y="75" width="110" height="50" rx="8" fill="#fde68a" filter="url(#shD)"/>
  <text x="815" y="98" text-anchor="middle" font-size="12" font-weight="600" fill="#78350f">⑤ 入库</text>
  <text x="815" y="115" text-anchor="middle" font-size="9" fill="#92400e">写入DB表</text>

  <!-- Arrows between steps -->
  <path d="M320 100 L340 100" stroke="#64748b" stroke-width="2" marker-end="url(#arrD)" fill="none"/>
  <path d="M460 100 L480 100" stroke="#64748b" stroke-width="2" marker-end="url(#arrD)" fill="none"/>
  <path d="M600 100 L620 100" stroke="#64748b" stroke-width="2" marker-end="url(#arrD)" fill="none"/>
  <path d="M740 100 L760 100" stroke="#64748b" stroke-width="2" marker-end="url(#arrD)" fill="none"/>

  <!-- Dedup strategy detail -->
  <rect x="200" y="150" width="670" height="55" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="535" y="170" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">去重策略（on_conflict）</text>
  <rect x="230" y="178" width="130" height="20" rx="4" fill="#94a3b8" opacity="0.2"/><text x="295" y="192" text-anchor="middle" font-size="10" fill="#475569">skip 跳过(默认)</text>
  <rect x="380" y="178" width="130" height="20" rx="4" fill="#f59e0b" opacity="0.2"/><text x="445" y="192" text-anchor="middle" font-size="10" fill="#92400e">overwrite 覆盖</text>
  <rect x="530" y="178" width="130" height="20" rx="4" fill="#10b981" opacity="0.2"/><text x="595" y="192" text-anchor="middle" font-size="10" fill="#065f46">new_version 新版本</text>
  <rect x="680" y="178" width="170" height="20" rx="4" fill="#8b5cf6" opacity="0.15"/><text x="765" y="192" text-anchor="middle" font-size="10" fill="#5b21b6">content_sha256 内容指纹判重</text>

  <!-- Output -->
  <rect x="200" y="225" width="670" height="70" rx="8" fill="#d1fae5" opacity="0.2" stroke="#10b981" stroke-width="1"/>
  <text x="535" y="248" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">输出</text>
  <text x="280" y="270" text-anchor="middle" font-size="10" fill="#064e3b">✓ 导入报告（成功/失败/跳过统计）</text>
  <text x="535" y="270" text-anchor="middle" font-size="10" fill="#064e3b">✓ 场地记录（sites 表）</text>
  <text x="750" y="270" text-anchor="middle" font-size="10" fill="#064e3b">✓ 检测数据（measurements 长表）</text>
  <text x="535" y="285" text-anchor="middle" font-size="10" fill="#047857">每个采样点含经纬度·深度·因子·浓度·检测限·超标标记，全程可溯源</text>

  <!-- Standard -->
  <rect x="30" y="315" width="840" height="25" rx="6" fill="#f1f5f9"/>
  <text x="450" y="332" text-anchor="middle" font-size="10" fill="#64748b">依据：HJ/T 166-2004 土壤环境监测技术规范 · GB 15618-2018 农用地标准 · 支持检测限解析（&lt;0.001/ND/未检出）</text>
</svg>
