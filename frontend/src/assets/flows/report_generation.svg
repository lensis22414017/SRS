<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <linearGradient id="bgRp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2f7"/></linearGradient>
    <marker id="arrRp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/></marker>
    <filter id="shRp" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="900" height="320" fill="url(#bgRp)" rx="12"/>
  <text x="450" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1e293b">报告生成 — Jinja2 模板多格式自动输出</text>
  <line x1="100" y1="48" x2="800" y2="48" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Inputs -->
  <rect x="30" y="65" width="170" height="165" rx="8" fill="#dbeafe" opacity="0.25"/>
  <text x="115" y="85" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">输入</text>
  <rect x="40" y="95" width="150" height="32" rx="6" fill="#bfdbfe" filter="url(#shRp)"/><text x="115" y="116" text-anchor="middle" font-size="10" fill="#1e3a5f">场地全量数据</text>
  <rect x="40" y="134" width="150" height="32" rx="6" fill="#bfdbfe" filter="url(#shRp)"/><text x="115" y="155" text-anchor="middle" font-size="10" fill="#1e3a5f">Jinja2 HTML 模板</text>
  <rect x="40" y="173" width="150" height="32" rx="6" fill="#bfdbfe" filter="url(#shRp)"/><text x="115" y="194" text-anchor="middle" font-size="10" fill="#1e3a5f">ECharts 图表快照</text>
  <rect x="40" y="212" width="150" height="14" rx="3" fill="#3b82f6" opacity="0.3"/><text x="115" y="222" text-anchor="middle" font-size="9" fill="#1e40af">诊断·评价·推荐·追溯</text>

  <!-- Arrow -->
  <path d="M200 148 L245 148" stroke="#64748b" stroke-width="2" marker-end="url(#arrRp)" fill="none"/>

  <!-- Pipeline -->
  <rect x="250" y="70" width="350" height="160" rx="10" fill="#fef3c7" opacity="0.2" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="425" y="90" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">渲染管线</text>
  <rect x="265" y="100" width="320" height="28" rx="6" fill="#fde68a"/><text x="425" y="119" text-anchor="middle" font-size="11" font-weight="600" fill="#78350f">① 数据聚合（场地关联数据收集）</text>
  <rect x="265" y="134" width="320" height="28" rx="6" fill="#fde68a"/><text x="425" y="153" text-anchor="middle" font-size="11" font-weight="600" fill="#78350f">② Jinja2 模板渲染 → HTML</text>
  <rect x="265" y="168" width="150" height="28" rx="6" fill="#fbbf24"/><text x="340" y="187" text-anchor="middle" font-size="10" font-weight="600" fill="#78350f">③ WeasyPrint</text>
  <rect x="435" y="168" width="150" height="28" rx="6" fill="#fbbf24"/><text x="510" y="187" text-anchor="middle" font-size="10" font-weight="600" fill="#78350f">④ python-docx</text>
  <rect x="265" y="202" width="320" height="22" rx="4" fill="#d97706"/><text x="425" y="217" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">⑤ 版本管理（版本号·时间·操作人）</text>

  <!-- Arrows to outputs -->
  <path d="M600 180 L660 130" stroke="#64748b" stroke-width="2" marker-end="url(#arrRp)" fill="none"/>
  <path d="M600 185 L660 170" stroke="#64748b" stroke-width="2" marker-end="url(#arrRp)" fill="none"/>
  <path d="M600 190 L660 210" stroke="#64748b" stroke-width="2" marker-end="url(#arrRp)" fill="none"/>

  <!-- Outputs -->
  <rect x="665" y="80" width="110" height="40" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1" filter="url(#shRp)"/>
  <text x="720" y="100" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">📕 PDF</text>
  <text x="720" y="115" text-anchor="middle" font-size="9" fill="#7f1d1d">打印·归档</text>

  <rect x="665" y="145" width="110" height="40" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1" filter="url(#shRp)"/>
  <text x="720" y="165" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">📘 DOCX</text>
  <text x="720" y="180" text-anchor="middle" font-size="9" fill="#1e3a5f">编辑·协作</text>

  <rect x="665" y="195" width="110" height="40" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="1" filter="url(#shRp)"/>
  <text x="720" y="215" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">📄 HTML</text>
  <text x="720" y="230" text-anchor="middle" font-size="9" fill="#047857">在线预览</text>

  <!-- Version metadata -->
  <rect x="30" y="250" width="840" height="50" rx="8" fill="#fff" stroke="#e2e8f0"/>
  <text x="50" y="270" font-size="11" font-weight="600" fill="#334155">版本追踪</text>
  <text x="50" y="288" font-size="10" fill="#64748b">每次生成记录：report_id · 版本号(v1/v2/...) · 生成时间 · 数据快照版本 · 模型版本 · 操作人 · 文件哈希</text>
  <text x="50" y="300" font-size="10" fill="#94a3b8">依据：HJ 25.5-2018 附录 — 修复效果评估报告编制要求 · 污染地块土壤环境管理办法第24条 — 信息公开与报告</text>
</svg>
