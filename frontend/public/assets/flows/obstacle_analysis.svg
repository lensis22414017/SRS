<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="'Helvetica Neue','Arial','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2f7"/></linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/></marker>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.1"/></filter>
  </defs>

  <rect width="900" height="600" fill="url(#bg)" rx="12"/>
  <text x="450" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#1e293b">障碍因子诊断方法 — KOS 关键障碍因子综合评分</text>
  <text x="450" y="56" text-anchor="middle" font-size="11" fill="#64748b">规则判障碍 · 权重定用途 · 模型给贡献 · 稳定性定关键 · 证据等级定可信度</text>
  <line x1="80" y1="70" x2="820" y2="70" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Input row -->
  <rect x="30" y="85" width="840" height="50" rx="8" fill="#dbeafe" opacity="0.3" stroke="#3b82f6" stroke-width="1" filter="url(#sh)"/>
  <text x="55" y="107" font-size="12" font-weight="700" fill="#1e40af">输入</text>
  <text x="55" y="125" font-size="10" fill="#1e3a5f">场地检测数据（measurements）</text>
  <text x="310" y="125" font-size="10" fill="#1e3a5f">GEE 空间协变量（14 项）</text>
  <text x="560" y="125" font-size="10" fill="#1e3a5f">阈值标准（GB15618 / GB36600）</text>

  <path d="M450 135 L450 150" stroke="#64748b" stroke-width="2" marker-end="url(#ar)" fill="none"/>

  <text x="450" y="165" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">观测层标准化 → 双轨阈值路由</text>

  <!-- Dual track -->
  <rect x="30" y="175" width="415" height="60" rx="8" fill="#dbeafe" opacity="0.25" stroke="#3b82f6" stroke-width="1.5" filter="url(#sh)"/>
  <text x="50" y="196" font-size="13" font-weight="700" fill="#1e40af">生产轨 Production</text>
  <text x="50" y="214" font-size="10" fill="#1e3a5f">GB 15618 农用地 · 食用安全 / 作物吸收 / 肥力</text>
  <text x="50" y="228" font-size="10" fill="#1e3a5f">权重锚定课题二 AHP + 熵值组合赋权</text>

  <rect x="455" y="175" width="415" height="60" rx="8" fill="#d1fae5" opacity="0.25" stroke="#10b981" stroke-width="1.5" filter="url(#sh)"/>
  <text x="475" y="196" font-size="13" font-weight="700" fill="#065f46">生态轨 Ecology</text>
  <text x="475" y="214" font-size="10" fill="#064e3b">GB 36600 建设用地 · 生态毒性 / 植被恢复 / 生物活性</text>
  <text x="475" y="228" font-size="10" fill="#064e3b">权重锚定课题二 AHP + 熵值组合赋权</text>

  <path d="M237 235 L237 252" stroke="#64748b" stroke-width="2" marker-end="url(#ar)" fill="none"/>
  <path d="M662 235 L662 252" stroke="#64748b" stroke-width="2" marker-end="url(#ar)" fill="none"/>

  <!-- B and R -->
  <rect x="30" y="256" width="415" height="54" rx="8" fill="#fef3c7" opacity="0.25" stroke="#f59e0b" stroke-width="1.5" filter="url(#sh)"/>
  <text x="50" y="276" font-size="12" font-weight="700" fill="#92400e">明确障碍判定 B</text>
  <text x="50" y="292" font-size="9" fill="#78350f">上限型 x&gt;U · 下限型 x&lt;L · 区间型 x∉[L,U] · 等级型 g∈G</text>
  <text x="50" y="304" font-size="9" fill="#78350f">无阈值因子 → 不判定，标记"建议补测"（不伪装为零风险）</text>

  <rect x="455" y="256" width="415" height="54" rx="8" fill="#fee2e2" opacity="0.25" stroke="#ef4444" stroke-width="1.5" filter="url(#sh)"/>
  <text x="475" y="276" font-size="12" font-weight="700" fill="#991b1b">规则严重度 R</text>
  <text x="475" y="292" font-size="9" fill="#7f1d1d">R = min(1, log(1+x/U) / log(1+c))，对数截尾防极端值劫持</text>
  <text x="475" y="304" font-size="9" fill="#7f1d1d">区间型(pH/盐分)、下限型(SOC/CEC) 各有专属公式</text>

  <path d="M237 310 L237 326" stroke="#64748b" stroke-width="2" marker-end="url(#ar)" fill="none"/>
  <path d="M662 310 L662 326" stroke="#64748b" stroke-width="2" marker-end="url(#ar)" fill="none"/>

  <!-- KOS Core formula -->
  <rect x="30" y="330" width="840" height="130" rx="10" fill="#ede9fe" opacity="0.15" stroke="#7c3aed" stroke-width="2" filter="url(#sh)"/>
  <text x="450" y="354" text-anchor="middle" font-size="14" font-weight="700" fill="#5b21b6">KOS 关键障碍综合得分（仅在 B=1 时计算）</text>
  <line x1="80" y1="364" x2="820" y2="364" stroke="#c4b5fd"/>

  <rect x="100" y="374" width="700" height="34" rx="6" fill="#fff" stroke="#c4b5fd"/>
  <text x="450" y="396" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">KOS = B × ( 0.30 R + 0.25 W + 0.15 M + 0.20 S + 0.10 E )</text>

  <g font-size="9">
    <text x="70" y="425" font-weight="600" fill="#1e40af">R 规则严重度</text>
    <text x="70" y="438" fill="#64748b">超标程度(对数截尾)</text>
    <text x="230" y="425" font-weight="600" fill="#1e40af">W 用途权重</text>
    <text x="230" y="438" fill="#64748b">AHP+熵值组合赋权</text>
    <text x="390" y="425" font-weight="600" fill="#1e40af">M 模型贡献度</text>
    <text x="390" y="438" fill="#64748b">SHAP 均值归一化</text>
    <text x="550" y="425" font-weight="600" fill="#1e40af">S 稳定性</text>
    <text x="550" y="438" fill="#64748b">点/空间/Bootstrap/版本</text>
    <text x="700" y="425" font-weight="600" fill="#1e40af">E 证据强度</text>
    <text x="700" y="438" fill="#64748b">A/B/C/D四级(仅A/B入TopN)</text>
  </g>

  <path d="M450 460 L450 478" stroke="#64748b" stroke-width="2" marker-end="url(#ar)" fill="none"/>

  <!-- Output -->
  <rect x="30" y="482" width="415" height="50" rx="8" fill="#dbeafe" opacity="0.25" stroke="#3b82f6" stroke-width="1.5" filter="url(#sh)"/>
  <text x="50" y="502" font-size="12" font-weight="700" fill="#1e40af">KOS_prod 排序 → 生产用途诊断</text>
  <text x="50" y="520" font-size="9" fill="#1e3a5f">三层输出：明确障碍 + 关键障碍 Top-N + 补测建议</text>

  <rect x="455" y="482" width="415" height="50" rx="8" fill="#d1fae5" opacity="0.25" stroke="#10b981" stroke-width="1.5" filter="url(#sh)"/>
  <text x="475" y="502" font-size="12" font-weight="700" fill="#065f46">KOS_eco 排序 → 生态用途诊断</text>
  <text x="475" y="520" font-size="9" fill="#064e3b">三层输出：明确障碍 + 关键障碍 Top-N + 补测建议</text>

  <path d="M237 532 L237 548" stroke="#64748b" stroke-width="2" marker-end="url(#ar)" fill="none"/>
  <path d="M662 532 L662 548" stroke="#64748b" stroke-width="2" marker-end="url(#ar)" fill="none"/>

  <rect x="120" y="552" width="660" height="38" rx="8" fill="#f1f5f9" stroke="#cbd5e1" filter="url(#sh)"/>
  <text x="450" y="570" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">诊断报告（PDF）+ AI 通俗化润色（GLM-5.2）</text>
  <text x="450" y="584" text-anchor="middle" font-size="9" fill="#64748b">因子排序 · KOS 五分量分解 · Spearman 验证 · 补测清单 · 追溯审计</text>
</svg>
