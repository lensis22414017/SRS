<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="'Helvetica Neue','Arial','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bgT" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2f7"/></linearGradient>
    <marker id="arT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/></marker>
    <marker id="arBack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#dc2626"/></marker>
    <filter id="shT" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.1"/></filter>
  </defs>
  <rect width="900" height="400" fill="url(#bgT)" rx="12"/>
  <text x="450" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#1e293b">全流程追溯 — 调查 → 审批 → 施工 → 效果 → 管护 五阶段闭环</text>
  <line x1="80" y1="50" x2="820" y2="50" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Connection line -->
  <line x1="110" y1="110" x2="790" y2="110" stroke="#cbd5e1" stroke-width="3"/>

  <!-- Stage 1: blue -->
  <circle cx="110" cy="110" r="30" fill="#3b82f6" filter="url(#shT)"/>
  <text x="110" y="106" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">1</text>
  <text x="110" y="120" text-anchor="middle" font-size="8" fill="#dbeafe">调查</text>
  <rect x="30" y="150" width="160" height="90" rx="8" fill="#dbeafe" opacity="0.3" stroke="#3b82f6"/>
  <text x="110" y="170" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">调查评估</text>
  <text x="110" y="188" text-anchor="middle" font-size="9" fill="#1e3a5f">初步调查</text>
  <text x="110" y="202" text-anchor="middle" font-size="9" fill="#1e3a5f">详细调查</text>
  <text x="110" y="216" text-anchor="middle" font-size="9" fill="#1e3a5f">风险评估</text>
  <text x="110" y="230" text-anchor="middle" font-size="9" fill="#1e3a5f">确定修复目标</text>

  <!-- Stage 2: green -->
  <circle cx="280" cy="110" r="30" fill="#10b981" filter="url(#shT)"/>
  <text x="280" y="106" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">2</text>
  <text x="280" y="120" text-anchor="middle" font-size="8" fill="#d1fae5">审批</text>
  <rect x="200" y="150" width="160" height="90" rx="8" fill="#d1fae5" opacity="0.3" stroke="#10b981"/>
  <text x="280" y="170" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">方案审批</text>
  <text x="280" y="188" text-anchor="middle" font-size="9" fill="#064e3b">修复方案编制</text>
  <text x="280" y="202" text-anchor="middle" font-size="9" fill="#064e3b">专家评审</text>
  <text x="280" y="216" text-anchor="middle" font-size="9" fill="#064e3b">主管部门审批</text>
  <text x="280" y="230" text-anchor="middle" font-size="9" fill="#064e3b">方案备案</text>

  <!-- Stage 3: amber -->
  <circle cx="450" cy="110" r="30" fill="#f59e0b" filter="url(#shT)"/>
  <text x="450" y="106" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">3</text>
  <text x="450" y="120" text-anchor="middle" font-size="8" fill="#fef3c7">施工</text>
  <rect x="370" y="150" width="160" height="90" rx="8" fill="#fef3c7" opacity="0.3" stroke="#f59e0b"/>
  <text x="450" y="170" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">施工监理</text>
  <text x="450" y="188" text-anchor="middle" font-size="9" fill="#78350f">修复工程施工</text>
  <text x="450" y="202" text-anchor="middle" font-size="9" fill="#78350f">过程监测</text>
  <text x="450" y="216" text-anchor="middle" font-size="9" fill="#78350f">监理记录</text>
  <text x="450" y="230" text-anchor="middle" font-size="9" fill="#78350f">阶段性验收</text>

  <!-- Stage 4: purple -->
  <circle cx="620" cy="110" r="30" fill="#7c3aed" filter="url(#shT)"/>
  <text x="620" y="106" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">4</text>
  <text x="620" y="120" text-anchor="middle" font-size="8" fill="#ede9fe">效果</text>
  <rect x="540" y="150" width="160" height="90" rx="8" fill="#ede9fe" opacity="0.3" stroke="#7c3aed"/>
  <text x="620" y="170" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6">效果评估</text>
  <text x="620" y="188" text-anchor="middle" font-size="9" fill="#6d28d9">修复后检测</text>
  <text x="620" y="202" text-anchor="middle" font-size="9" fill="#6d28d9">达标判定</text>
  <text x="620" y="216" text-anchor="middle" font-size="9" fill="#6d28d9">效果评估报告</text>
  <text x="620" y="230" text-anchor="middle" font-size="9" fill="#6d28d9">竣工验收</text>

  <!-- Stage 5: red -->
  <circle cx="790" cy="110" r="30" fill="#ef4444" filter="url(#shT)"/>
  <text x="790" y="106" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">5</text>
  <text x="790" y="120" text-anchor="middle" font-size="8" fill="#fee2e2">管护</text>
  <rect x="710" y="150" width="160" height="90" rx="8" fill="#fee2e2" opacity="0.3" stroke="#ef4444"/>
  <text x="790" y="170" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">后期管护</text>
  <text x="790" y="188" text-anchor="middle" font-size="9" fill="#7f1d1d">长期监测计划</text>
  <text x="790" y="202" text-anchor="middle" font-size="9" fill="#7f1d1d">制度控制</text>
  <text x="790" y="216" text-anchor="middle" font-size="9" fill="#7f1d1d">定期巡检</text>
  <text x="790" y="230" text-anchor="middle" font-size="9" fill="#7f1d1d">管护归档</text>

  <!-- Return arrow -->
  <path d="M620 245 Q 620 285 450 285 Q 280 285 110 285 L 110 245" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arBack)" fill="none" opacity="0.5"/>
  <text x="365" y="302" text-anchor="middle" font-size="10" fill="#dc2626" font-style="italic">效果不达标 → 退回重新修复</text>

  <!-- Status legend -->
  <rect x="30" y="318" width="840" height="60" rx="8" fill="#fff" stroke="#e2e8f0"/>
  <text x="50" y="340" font-size="11" font-weight="600" fill="#334155">阶段状态机</text>
  <circle cx="165" cy="352" r="6" fill="#94a3b8"/><text x="178" y="356" font-size="10" fill="#475569">未开始</text>
  <circle cx="245" cy="352" r="6" fill="#3b82f6"/><text x="258" y="356" font-size="10" fill="#475569">进行中</text>
  <circle cx="325" cy="352" r="6" fill="#10b981"/><text x="338" y="356" font-size="10" fill="#475569">已完成</text>
  <circle cx="405" cy="352" r="6" fill="#dc2626"/><text x="418" y="356" font-size="10" fill="#475569">已退回</text>
  <text x="50" y="372" font-size="10" fill="#64748b">每阶段须前一阶段完成才推进；退回须填原因；已完成可重开（需理由）；全程操作审计留痕</text>
</svg>
