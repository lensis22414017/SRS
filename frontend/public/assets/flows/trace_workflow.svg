<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <linearGradient id="bgT" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2f7"/></linearGradient>
    <linearGradient id="s1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <linearGradient id="s2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <linearGradient id="s3" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#d97706"/></linearGradient>
    <linearGradient id="s4" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#059669"/></linearGradient>
    <linearGradient id="s5" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#64748b"/><stop offset="1" stop-color="#475569"/></linearGradient>
    <marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/></marker>
    <marker id="arrBack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#ef4444"/></marker>
    <filter id="shT" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/></filter>
  </defs>

  <rect width="900" height="400" fill="url(#bgT)" rx="12"/>
  <text x="450" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1e293b">全流程追溯 — 调查 → 审批 → 施工 → 效果 → 管护 五阶段监管闭环</text>
  <line x1="80" y1="48" x2="820" y2="48" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Five stages as chevron arrows -->
  <!-- Stage 1 -->
  <path d="M30 70 L160 70 L185 110 L160 150 L30 150 L55 110 Z" fill="url(#s1)" filter="url(#shT)"/>
  <text x="100" y="102" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">阶段一</text>
  <text x="100" y="122" text-anchor="middle" font-size="13" font-weight="600" fill="#dbeafe">调查评估</text>

  <!-- Stage 2 -->
  <path d="M185 70 L325 70 L350 110 L325 150 L185 150 L210 110 Z" fill="url(#s2)" filter="url(#shT)"/>
  <text x="265" y="102" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">阶段二</text>
  <text x="265" y="122" text-anchor="middle" font-size="13" font-weight="600" fill="#ede9fe">方案审批</text>

  <!-- Stage 3 -->
  <path d="M350 70 L490 70 L515 110 L490 150 L350 150 L375 110 Z" fill="url(#s3)" filter="url(#shT)"/>
  <text x="430" y="102" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">阶段三</text>
  <text x="430" y="122" text-anchor="middle" font-size="13" font-weight="600" fill="#fef3c7">施工监理</text>

  <!-- Stage 4 -->
  <path d="M515 70 L655 70 L680 110 L655 150 L515 150 L540 110 Z" fill="url(#s4)" filter="url(#shT)"/>
  <text x="595" y="102" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">阶段四</text>
  <text x="595" y="122" text-anchor="middle" font-size="13" font-weight="600" fill="#d1fae5">效果评估</text>

  <!-- Stage 5 -->
  <path d="M680 70 L820 70 L845 110 L820 150 L680 150 L705 110 Z" fill="url(#s5)" filter="url(#shT)"/>
  <text x="760" y="102" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">阶段五</text>
  <text x="760" y="122" text-anchor="middle" font-size="13" font-weight="600" fill="#e2e8f0">后期管护</text>

  <!-- Detail rows under each stage -->
  <!-- S1 details -->
  <rect x="30" y="165" width="155" height="80" rx="6" fill="#dbeafe" opacity="0.4"/>
  <text x="105" y="183" text-anchor="middle" font-size="10" fill="#1e40af">初步调查</text>
  <text x="105" y="199" text-anchor="middle" font-size="10" fill="#1e40af">详细调查</text>
  <text x="105" y="215" text-anchor="middle" font-size="10" fill="#1e40af">风险评估</text>
  <text x="105" y="231" text-anchor="middle" font-size="10" fill="#1e40af">确定修复目标</text>

  <!-- S2 details -->
  <rect x="190" y="165" width="160" height="80" rx="6" fill="#ede9fe" opacity="0.4"/>
  <text x="270" y="183" text-anchor="middle" font-size="10" fill="#5b21b6">修复方案编制</text>
  <text x="270" y="199" text-anchor="middle" font-size="10" fill="#5b21b6">专家评审</text>
  <text x="270" y="215" text-anchor="middle" font-size="10" fill="#5b21b6">主管部门审批</text>
  <text x="270" y="231" text-anchor="middle" font-size="10" fill="#5b21b6">方案备案</text>

  <!-- S3 details -->
  <rect x="355" y="165" width="160" height="80" rx="6" fill="#fef3c7" opacity="0.4"/>
  <text x="435" y="183" text-anchor="middle" font-size="10" fill="#92400e">修复工程施工</text>
  <text x="435" y="199" text-anchor="middle" font-size="10" fill="#92400e">过程监测</text>
  <text x="435" y="215" text-anchor="middle" font-size="10" fill="#92400e">监理记录</text>
  <text x="435" y="231" text-anchor="middle" font-size="10" fill="#92400e">阶段性验收</text>

  <!-- S4 details -->
  <rect x="520" y="165" width="160" height="80" rx="6" fill="#d1fae5" opacity="0.4"/>
  <text x="600" y="183" text-anchor="middle" font-size="10" fill="#065f46">修复后检测</text>
  <text x="600" y="199" text-anchor="middle" font-size="10" fill="#065f46">达标判定</text>
  <text x="600" y="215" text-anchor="middle" font-size="10" fill="#065f46">效果评估报告</text>
  <text x="600" y="231" text-anchor="middle" font-size="10" fill="#065f46">竣工验收</text>

  <!-- S5 details -->
  <rect x="685" y="165" width="160" height="80" rx="6" fill="#e2e8f0" opacity="0.4"/>
  <text x="765" y="183" text-anchor="middle" font-size="10" fill="#334155">长期监测计划</text>
  <text x="765" y="199" text-anchor="middle" font-size="10" fill="#334155">制度控制</text>
  <text x="765" y="215" text-anchor="middle" font-size="10" fill="#334155">定期巡检</text>
  <text x="765" y="231" text-anchor="middle" font-size="10" fill="#334155">管护归档</text>

  <!-- Return/feedback arrow -->
  <path d="M600 250 Q 600 280 435 280 Q 270 280 105 280 L 105 250" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrBack)" fill="none" opacity="0.5"/>
  <text x="350" y="295" text-anchor="middle" font-size="10" fill="#dc2626" font-style="italic">效果不达标 → 退回施工/方案阶段重新修复</text>

  <!-- Status legend -->
  <rect x="30" y="315" width="840" height="65" rx="8" fill="#fff" stroke="#e2e8f0"/>
  <text x="50" y="335" font-size="11" font-weight="600" fill="#334155">状态机：</text>
  <circle cx="125" cy="348" r="6" fill="#94a3b8"/><text x="138" y="352" font-size="10" fill="#475569">未开始</text>
  <circle cx="205" cy="348" r="6" fill="#3b82f6"/><text x="218" y="352" font-size="10" fill="#475569">进行中</text>
  <circle cx="285" cy="348" r="6" fill="#10b981"/><text x="298" y="352" font-size="10" fill="#475569">已完成</text>
  <circle cx="365" cy="348" r="6" fill="#ef4444"/><text x="378" y="352" font-size="10" fill="#475569">已退回</text>
  <text x="50" y="370" font-size="10" fill="#64748b">每阶段必须前一阶段完成才能推进；退回需填写原因；已完成可重新打开（需理由）；全程操作审计留痕</text>
</svg>
