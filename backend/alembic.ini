[alembic]
script_location = alembic
sqlalchemy.url = driver://user:pass@localhost/dbname  ; 运行时由 env.py 从 DATABASE_URL 覆盖

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
